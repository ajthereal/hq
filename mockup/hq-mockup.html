<title>HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width app, five tabs, Today as home. Soft blue canvas, white cards, one orange accent. */
:root{
  --bg:#F3F7FC; --card:#FFFFFF; --ink:#12233B; --mute:#6B7C93; --line:#E1E9F3;
  --sky:#DCEAFB; --sky-ink:#2B5C9E; --accent:#F26B1D; --accent-ink:#FFFFFF;
  --warn-bg:#FFF0E6; --warn-ink:#B8470C; --ok:#2E8B63; --ok-bg:#E4F5EC;
  --display:'Sora',system-ui,sans-serif; --body:'Manrope',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1726; --card:#16233A; --ink:#EAF1FB; --mute:#8FA3BF; --line:#243553;
  --sky:#1C3454; --sky-ink:#9CC3F5; --accent:#FF8240; --accent-ink:#1A0E05;
  --warn-bg:#3A2415; --warn-ink:#FFB280; --ok:#5CD39B; --ok-bg:#16352A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1726; --card:#16233A; --ink:#EAF1FB; --mute:#8FA3BF; --line:#243553;
  --sky:#1C3454; --sky-ink:#9CC3F5; --accent:#FF8240; --accent-ink:#1A0E05;
  --warn-bg:#3A2415; --warn-ink:#FFB280; --ok:#5CD39B; --ok-bg:#16352A; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.app{max-width:460px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.top{padding-top:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:26px;line-height:1.15}
.sub{color:var(--mute);font-size:13px;margin-top:2px}
.sample{font-size:11px;color:var(--sky-ink);background:var(--sky);padding:4px 9px;border-radius:99px;white-space:nowrap;margin-bottom:4px}
section{margin-top:22px}
.lbl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.lbl h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.lbl span{font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.row{display:flex;align-items:center;gap:12px;padding:6px 14px 6px 6px}
.row + .row{border-top:1px solid var(--line)}
.chk{width:44px;height:44px;display:grid;place-items:center;flex:none}
.chk i{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:block}
.row.done .chk i{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 4px var(--card)}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.t{flex:1;min-width:0}
.t b{font-weight:600;display:block;overflow-wrap:anywhere}
.t small{color:var(--mute);font-size:12.5px}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sky);color:var(--sky-ink);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn-ink)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.overdue{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:var(--warn-bg)}
.overdue .row + .row{border-color:color-mix(in srgb,var(--accent) 25%,var(--line))}
.inbox{display:flex;align-items:center;gap:12px;padding:0 14px;width:100%;text-align:left}
.inbox .n{font-family:var(--display);font-weight:700;background:var(--accent);color:var(--accent-ink);min-width:28px;height:28px;border-radius:99px;display:grid;place-items:center;font-size:14px}
.top3{display:grid;gap:8px}
.t3{display:flex;gap:12px;align-items:center;padding:6px 14px 6px 6px}
.t3 .num{font-family:var(--display);font-weight:700;font-size:20px;color:var(--accent);width:44px;text-align:center}
.tl{position:relative;padding-left:62px}
.ev{position:relative;padding:10px 12px;border-radius:12px;background:var(--sky);color:var(--sky-ink);margin-bottom:8px}
.ev.free{background:transparent;border:1px dashed var(--line);color:var(--mute)}
.ev time{position:absolute;left:-62px;top:10px;width:54px;font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.ev b{display:block;font-size:14px}.ev small{font-size:12px;opacity:.85}
.nowline{height:2px;background:var(--accent);margin:2px 0 10px;position:relative}
.nowline::before{content:"Sekarang";position:absolute;left:-62px;top:-9px;font-size:11px;font-weight:700;color:var(--accent);width:54px;text-align:right}
.miss{margin-top:22px;padding:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.miss b{width:100%;font-family:var(--display);font-size:14px}
.chip{padding:0 12px;min-height:44px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:14px}
.act{display:flex;gap:8px;padding:0 14px 12px}
.act button{flex:1;border-radius:10px;font-weight:700;font-size:13px;background:var(--sky);color:var(--sky-ink)}
.act button.main{background:var(--accent);color:var(--accent-ink)}
.person{padding-top:12px}
.person .head{display:flex;gap:12px;align-items:center;padding:0 14px 10px}
.av{width:40px;height:40px;border-radius:50%;background:var(--sky);color:var(--sky-ink);display:grid;place-items:center;font-family:var(--display);font-weight:600;flex:none}
.person + .person{margin-top:10px}
.bar{height:10px;border-radius:99px;background:var(--sky);overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--sky-ink);border-radius:99px}
.bar i.low{background:var(--accent)}
.tm{padding:14px;margin-bottom:10px}
.tm .l{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;align-items:baseline}
.tm .l b{font-family:var(--display);font-size:15px}
.num-t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mute)}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.col{flex:none;width:210px}
.col h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin-bottom:8px;font-weight:600}
.pc{padding:12px;margin-bottom:8px;font-size:13.5px}
.pc small{display:block;color:var(--mute);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:14px;text-align:left;min-height:84px;display:block}
.tile b{font-family:var(--display);font-size:15px;display:block}
.tile small{color:var(--mute);font-size:12.5px}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav .in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mute);border-radius:10px;padding:4px 0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--sky-ink)}
nav button[aria-current="page"] svg{stroke:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(242,107,29,.35);z-index:6;display:grid;place-items:center;padding:0 0 3px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,35,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.sheet h3{font-size:18px}
.sheet input[type=text],.sheet select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink)}
.bubble{background:var(--ok-bg);color:var(--ink);border-radius:14px 14px 4px 14px;padding:12px 14px;font-size:14px}
.go{background:var(--accent);color:var(--accent-ink);border-radius:12px;font-weight:700;min-height:48px}
.ghost{border:1px solid var(--line);border-radius:12px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.note{font-size:13px;color:var(--mute);margin-top:18px}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

<div class="app" id="app"></div>
<button class="fab" id="fab" aria-label="Tambah cepat">+</button>
<nav><div class="in" id="nav"></div></nav>

<script>
var TABS=[
 ['today','Today','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>'],
 ['people','People','<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.6M18 14.4c1.6.8 2.6 2.4 3 4.6"/></svg>'],
 ['team','Team','<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>'],
 ['content','Content','<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4-2.5z"/></svg>'],
 ['more','More','<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>']
];
var tab='today', filter='Semua';
var tasks=[
 {id:1,t:'Follow up Rina, hasil Prysm minggu lalu',k:'Follow-up',due:'y',done:false},
 {id:2,t:'Kirim bukti setor PPh 21',k:'PT AHU',due:'y',done:false},
 {id:3,t:'Script video "Nasi padang 600 kalori"',k:'Content',due:'t',done:false},
 {id:4,t:'Cek hari ke-7 TRME Dewi',k:'TRME',due:'t',done:false},
 {id:5,t:'Kirim brief ke editor video',k:'Content',due:'t',done:false},
 {id:6,t:'Bandingkan harga kamera untuk set rekam',k:'',due:null,done:false},
 {id:7,t:'Telepon Pak Hendra soal PO',k:'Follow-up',due:null,done:false},
 {id:8,t:'Siapkan materi BSE Senin',k:'Team',due:'m',done:false},
 {id:9,t:'Reels: before after Ibu Sari',k:'Content',due:'m',done:false},
 {id:10,t:'Ulang tahun Dewi',k:'Follow-up',due:'m',done:false}
];
var top3=[1,3,4];
var people=[
 {n:'Rina Wijaya',st:'Prospect',note:'Prysm 62, mau ngobrol soal berat badan',msg:'Hai Rina, aku mau lihat hasil Prysm kamu minggu lalu. Kamu ada waktu ngobrol 10 menit hari ini?'},
 {n:'Dewi Anggraeni',st:'TRME Active',note:'Hari ke-7, berat turun 1,8 kg',msg:'Hai Dewi, hari ke-7 nih. Gimana tidurnya sama porsi makan malam? Kirim foto piringmu ya.'},
 {n:'Hendra Lim',st:'Closing',note:'Tanya soal paket 3 bulan',msg:'Pak Hendra, ini rincian paket 3 bulan yang kemarin kita bahas. Mau aku bantu order hari ini?'},
 {n:'Sari Putri',st:'Customer',note:'Hari ke-90, siap cerita hasilnya',msg:'Bu Sari, hasil 90 hari kamu bagus banget. Boleh aku ceritakan di Reels? Fotonya aku sensor kalau mau.'},
 {n:'Tomi Gunawan',st:'Namelist',note:'Teman tennis, belum pernah ngobrol soal ini',msg:'Tom, lama ga main bareng. Minggu ini ada waktu ngopi?'}
];
var team=[
 {n:'Lucky M.',v:3420,g:6000},{n:'Jeffrey N.',v:2650,g:5000},{n:'Mitra A.',v:1180,g:3000},{n:'Mitra B.',v:3010,g:3000},{n:'Mitra C.',v:420,g:3000}
];
var pipe=[
 ['Idea',[['Berat turun tapi lemak tetap?','Pillar Sains']]],
 ['Script',[['Nasi padang 600 kalori','YouTube, 3 turunan']]],
 ['Recorded',[['Kenapa timbangan bohong','YouTube, 2 turunan']]],
 ['With editor',[['Protein 1,6 g per kg','Deadline Rabu']]],
 ['Scheduled',[['Reels: sarapan 30 gram protein','Sen 07.00']]]
];
var $=function(s){return document.querySelector(s)};
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function row(t){return '<div class="row'+(t.done?' done':'')+'"><button class="chk" data-done="'+t.id+'" aria-label="Selesai"><i></i></button><div class="t"><b>'+esc(t.t)+'</b>'+(t.k?'<small>'+esc(t.k)+'</small>':'')+'</div></div>'}
function nav(){
 $('#nav').innerHTML=TABS.map(function(x){return '<button data-tab="'+x[0]+'"'+(tab===x[0]?' aria-current="page"':'')+'>'+x[2]+x[1]+'</button>'}).join('');
}
function today(){
 var open=function(f){return tasks.filter(function(t){return !t.done&&f(t)})};
 var od=open(function(t){return t.due==='y'}), td=tasks.filter(function(t){return t.due==='t'}), nd=open(function(t){return t.due===null}), tm=open(function(t){return t.due==='m'});
 var h='<div class="top"><div><h1>Sabtu, 31 Okt</h1><div class="sub">'+od.length+' terlambat, '+open(function(t){return t.due==='t'}).length+' hari ini, '+nd.length+' belum ada tanggal</div></div><span class="sample">Contoh data</span></div>';
 if(od.length) h+='<section><div class="lbl"><h2>Terlambat</h2><span>tetap di sini sampai selesai</span></div><div class="card overdue">'+od.map(row).join('')+'</div></section>';
 h+='<section><div class="lbl"><h2>Top 3 hari ini</h2><span>dipilih tiap pagi</span></div><div class="card">'+top3.map(function(id,i){var t=tasks.filter(function(x){return x.id===id})[0];return '<div class="row'+(t.done?' done':'')+'"><div class="num" style="font-family:var(--display);font-weight:700;color:var(--accent);width:44px;text-align:center;font-size:20px">'+(i+1)+'</div><div class="t"><b>'+esc(t.t)+'</b><small>'+esc(t.k)+'</small></div><button class="chk" data-done="'+t.id+'" aria-label="Selesai"><i></i></button></div>'}).join('')+'</div></section>';
 h+='<section><div class="lbl"><h2>Jadwal</h2><span>dari Google Calendar</span></div><div class="tl">'+
  '<div class="ev"><time>07.00</time><b>Tennis bareng</b><small>Lapangan Aloysius, 2 jam</small></div>'+
  '<div class="nowline"></div>'+
  '<div class="ev"><time>10.00</time><b>Meeting Lucky dan Jeffrey</b><small>Zoom, 10.00 sampai 12.00</small></div>'+
  '<div class="ev free"><time>12.00</time>Kosong sampai 15.00. Cocok untuk rekam script.</div>'+
  '<div class="ev"><time>19.30</time><b>RCP</b><small>Zoom, 19.30 sampai 21.30</small></div></div></section>';
 h+='<section><div class="lbl"><h2>Hari ini</h2><span>'+td.filter(function(t){return t.done}).length+' dari '+td.length+' selesai</span></div><div class="card">'+td.map(row).join('')+'</div></section>';
 h+='<section><div class="lbl"><h2>Belum ada tanggal</h2></div><button class="card inbox" id="inbox"><span class="n">'+nd.length+'</span><span class="t" style="padding:12px 0"><b>Inbox</b><small>'+(nd.length?esc(nd[0].t)+(nd.length>1?' dan '+(nd.length-1)+' lainnya':''):'Kosong')+'</small></span><span class="tag">Atur tanggal</span></button></section>';
 h+='<section><div class="lbl"><h2>Besok</h2><span>Minggu, 1 Nov</span></div><div class="card">'+tm.map(row).join('')+'</div></section>';
 h+='<div class="card miss"><b>Ada yang terlewat?</b><button class="chip">'+od.length+' terlambat</button><button class="chip">'+nd.length+' tanpa tanggal</button><button class="chip">'+tm.length+' untuk besok</button><span style="width:100%;color:var(--mute);font-size:12.5px">Jam 20.30 aku kirim notifikasi kalau masih ada yang terlambat atau tanpa tanggal.</span></div>';
 return h;
}
function ppl(){
 var sts=['Semua','Prospect','TRME Active','Closing','Customer','Namelist'];
 var h='<div class="top"><div><h1>People</h1><div class="sub">'+people.length+' orang, urut yang perlu dihubungi</div></div><span class="sample">Contoh data</span></div>';
 h+='<div class="chips">'+sts.map(function(s){return '<button class="chip'+(filter===s?' on':'')+'" data-f="'+s+'">'+s+'</button>'}).join('')+'</div>';
 h+='<section style="margin-top:14px">'+people.map(function(p,i){if(filter!=='Semua'&&p.st!==filter)return '';
  return '<div class="card person"><div class="head"><div class="av">'+p.n[0]+'</div><div class="t"><b>'+esc(p.n)+'</b><small>'+esc(p.note)+'</small></div><span class="tag">'+p.st+'</span></div><div class="act"><button class="main" data-msg="'+i+'">Message</button><button data-log="'+i+'">Log</button><button data-next="'+i+'">Next</button></div></div>'}).join('')+'</section>';
 return h+'<p class="note">Message membuka WhatsApp dengan teks siap kirim, lalu otomatis tercatat sebagai kontak.</p>';
}
function tm(){
 var h='<div class="top"><div><h1>Team</h1><div class="sub">Volume Oktober, minimal 3.000 per orang</div></div><span class="sample">Contoh data</span></div><section>';
 h+=team.map(function(m){var pc=Math.min(100,Math.round(m.v/m.g*100)),pace=m.v>=3000;return '<div class="card tm"><div class="l"><b>'+m.n+'</b><span class="tag '+(pace?'ok':'warn')+'">'+(pace?'Lolos 3.000':'Kurang '+(3000-m.v).toLocaleString('id-ID'))+'</span></div><div class="bar"><i class="'+(pace?'':'low')+'" style="width:'+pc+'%"></i></div><div class="num-t" style="margin-top:6px">'+m.v.toLocaleString('id-ID')+' dari target '+m.g.toLocaleString('id-ID')+'</div></div>'}).join('');
 h+='</section><button class="go" style="width:100%;margin-top:6px" id="mon">Monitoring AJ</button><p class="note">Tombol ini menyusun teks laporan harian ke upline dan membuka WhatsApp.</p>';
 return h;
}
function cnt(){
 var h='<div class="top"><div><h1>Content</h1><div class="sub">Satu video, semua turunannya</div></div><span class="sample">Contoh data</span></div><section><div class="board">';
 h+=pipe.map(function(c){return '<div class="col"><h3>'+c[0]+'</h3>'+c[1].map(function(x){return '<div class="card pc"><b>'+x[0]+'</b><small>'+x[1]+'</small></div>'}).join('')+'</div>'}).join('');
 h+='</div></section><section><div class="lbl"><h2>Hand-off editor</h2></div><div class="card" style="padding:14px"><b style="font-family:var(--display)">Protein 1,6 g per kg</b><div class="sub">Folder Drive siap, deadline Rabu</div><div class="act" style="padding:12px 0 0"><button class="main" id="ed">WhatsApp editor</button><button data-claude="1">Buat di Claude</button></div></div></section>';
 return h;
}
function more(){
 var t=[['Trips','Singapura, 14 sampai 17 Nov'],['Word','Hari ini: Mazmur 23'],['PT AHU','Tutup buku Oktober'],['Launcher','VNG, Zoom, CapCut, Canva'],['Kalender','Minggu ini'],['Template WhatsApp','8 template']];
 return '<div class="top"><div><h1>More</h1></div><span class="sample">Contoh data</span></div><section><div class="tiles">'+t.map(function(x){return '<button class="card tile"><b>'+x[0]+'</b><small>'+x[1]+'</small></button>'}).join('')+'</div></section>';
}
function render(){
 nav();
 $('#app').innerHTML={today:today,people:ppl,team:tm,content:cnt,more:more}[tab]();
 $('#fab').hidden=false;
}
function sheet(html){var b=document.createElement('div');b.className='sheet-bg';b.innerHTML='<div class="sheet" role="dialog">'+html+'</div>';b.addEventListener('click',function(e){if(e.target===b||e.target.dataset.close)b.remove()});document.body.appendChild(b);return b}
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-tab],[data-done],[data-f],[data-msg],[data-log],[data-next],#fab,#inbox,#mon,#ed,[data-claude]');if(!el)return;
 if(el.dataset.tab){tab=el.dataset.tab;render();window.scrollTo(0,0);return}
 if(el.dataset.done){var t=tasks.filter(function(x){return x.id==el.dataset.done})[0];t.done=!t.done;render();if(t.done)toast('Selesai');return}
 if(el.dataset.f){filter=el.dataset.f;render();return}
 if(el.dataset.msg){var p=people[el.dataset.msg];var b=sheet('<h3>Kirim ke '+esc(p.n)+'</h3><div class="bubble">'+esc(p.msg)+'</div><button class="go" data-ok="1">Buka WhatsApp</button><button class="ghost" data-close="1" style="min-height:46px">Ubah teks dulu</button><div class="sub">Setelah kamu kirim, HQ mencatat kontak ini dan menanyakan kapan follow-up berikutnya.</div>');b.querySelector('[data-ok]').onclick=function(){b.remove();toast('Tercatat. Follow-up berikutnya?')};return}
 if(el.dataset.log){toast('Kontak dicatat, 2 ketukan');return}
 if(el.dataset.next){var b2=sheet('<h3>Follow-up berikutnya</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip">Besok</button><button class="chip">3 hari</button><button class="chip">Minggu depan</button><button class="chip">Pilih tanggal</button></div><button class="go" data-close="1">Simpan</button>');return}
 if(el.id==='fab'){var s=sheet('<h3>Catat cepat</h3><input type="text" id="q" placeholder="Apa yang mau diingat?" autocomplete="off"><select id="d"><option value="t">Hari ini</option><option value="m">Besok</option><option value="">Belum ada tanggal</option></select><button class="go" id="save">Simpan</button><div class="sub">Tanpa tanggal pun tetap muncul di Today, di bagian Inbox.</div>');s.querySelector('#save').onclick=function(){var v=s.querySelector('#q').value.trim();if(!v){toast('Tulis dulu isinya');return}var d=s.querySelector('#d').value;tasks.push({id:Date.now(),t:v,k:'',due:d||null,done:false});s.remove();tab='today';render();toast(d?'Masuk ke Today':'Masuk ke Inbox');};return}
 if(el.id==='inbox'){toast('Di app asli: atur tanggal satu per satu');return}
 if(el.id==='mon'){sheet('<h3>Laporan harian</h3><div class="bubble">Update Team hari ini. 2 dari 5 leader sudah lolos 3.000. Mitra C masih 420, aku follow up sore ini.</div><button class="go" data-close="1">Buka WhatsApp</button>');return}
 if(el.id==='ed'){toast('Membuka WhatsApp ke editor');return}
 if(el.dataset.claude){toast('Membuka Claude dengan brief dan aturan gaya');return}
});
render();
</script>
