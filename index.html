<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>HQ</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HQ">
<meta name="theme-color" content="#09090A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: Tiimo-style day list. Phone = one column with floating tab capsule. iPad and Mac = sidebar, multi-pane (timeline, master-detail, board). */
:root{
  --bg:#09090A; --card:#131315; --card2:#1C1C1F; --ink:#F5F4F1; --mute:#8D8D96; --line:#27272B;
  --late-bg:#B4532B; --late-ink:#FFF3EC; --morning-bg:#8D8847; --morning-ink:#FFFBE0;
  --aft-bg:#5F3B50; --aft-ink:#FFE9F3; --eve-bg:#4B3F7D; --eve-ink:#EEEAFF; --nod-bg:#222226; --nod-ink:#E8E8EC;
  --blue:#1558B0; --ok:#7ED3A6; --ok-ink:#06251A; --warn:#F2A15F; --crit:#F0735A;
  --chart:#7FB3FF; --btn:#F5F4F1; --btn-ink:#09090A; --glass:rgba(32,32,36,.82); --shadow:rgba(0,0,0,.5);
  --display:'Fraunces',Georgia,serif; --body:'DM Sans',system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F6F5F2; --card:#FFFFFF; --card2:#EFEEEA; --ink:#17171A; --mute:#6C6C75; --line:#E4E3DE;
  --late-bg:#F6CDBA; --late-ink:#6B2A0E; --morning-bg:#EBE3A4; --morning-ink:#4A4410; --aft-bg:#EFCFDC; --aft-ink:#5B2340;
  --eve-bg:#DAD3F5; --eve-ink:#312466; --nod-bg:#E6E5E1; --nod-ink:#2D2D33; --blue:#2F6FD0; --ok:#4FB985; --ok-ink:#FFFFFF;
  --warn:#C9722A; --crit:#C94B34; --chart:#2F6FD0; --btn:#17171A; --btn-ink:#F6F5F2; --glass:rgba(255,255,255,.86); --shadow:rgba(30,30,40,.25); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F6F5F2; --card:#FFFFFF; --card2:#EFEEEA; --ink:#17171A; --mute:#6C6C75; --line:#E4E3DE;
  --late-bg:#F6CDBA; --late-ink:#6B2A0E; --morning-bg:#EBE3A4; --morning-ink:#4A4410; --aft-bg:#EFCFDC; --aft-ink:#5B2340;
  --eve-bg:#DAD3F5; --eve-ink:#312466; --nod-bg:#E6E5E1; --nod-ink:#2D2D33; --blue:#2F6FD0; --ok:#4FB985; --ok-ink:#FFFFFF;
  --warn:#C9722A; --crit:#C94B34; --chart:#2F6FD0; --btn:#17171A; --btn-ink:#F6F5F2; --glass:rgba(255,255,255,.86); --shadow:rgba(30,30,40,.25); color-scheme:light;}
:root[data-theme="dark"]{
  --bg:#09090A; --card:#131315; --card2:#1C1C1F; --ink:#F5F4F1; --mute:#8D8D96; --line:#27272B;
  --late-bg:#B4532B; --late-ink:#FFF3EC; --morning-bg:#8D8847; --morning-ink:#FFFBE0; --aft-bg:#5F3B50; --aft-ink:#FFE9F3;
  --eve-bg:#4B3F7D; --eve-ink:#EEEAFF; --nod-bg:#222226; --nod-ink:#E8E8EC; --blue:#1558B0; --ok:#7ED3A6; --ok-ink:#06251A;
  --warn:#F2A15F; --crit:#F0735A; --chart:#7FB3FF; --btn:#F5F4F1; --btn-ink:#09090A; --glass:rgba(32,32,36,.82); --shadow:rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;
  padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block;flex:none}
#chrome{flex:none;padding-top:max(6px,env(safe-area-inset-top,0px))!important;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
#chrome .seg2{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px}
#chrome .seg2 button{height:30px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mute)}
#chrome .seg2 button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
#chrome small{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#stage{padding-top:max(6px,env(safe-area-inset-top,0px));flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
#fwrap{position:relative;width:100%;height:100%}
#frame{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--bg);transform-origin:top left}
#frame.dev{border:1px solid var(--line);border-radius:30px;box-shadow:0 20px 60px var(--shadow)}
#shell{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.wide #shell{grid-template-columns:224px minmax(0,1fr)}
#scroller{overflow-y:auto;overflow-x:hidden;height:100%;position:relative;overscroll-behavior:contain}
.app{max-width:520px;margin:0 auto;padding:0 16px 130px}
.wide .app{max-width:none;padding:0 28px 60px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:12px}
.stats{display:flex;gap:14px;align-items:center;font-weight:600;font-size:14px}
.stats span{display:flex;gap:5px;align-items:center}
.stats .f{color:#C9A0FF}.stats .s{color:#9FD3E8}
.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
.capsule{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;height:40px}
.capsule button{width:46px;height:40px;display:grid;place-items:center}
h1{font-family:var(--display);font-weight:500;font-size:31px;line-height:1.05;margin:0;letter-spacing:-.01em}
.wide h1{font-size:34px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:16px}
.hrow small{color:var(--mute);font-size:11.5px;letter-spacing:.1em;font-weight:600;text-transform:uppercase;padding-bottom:6px;white-space:nowrap}
.sub{color:var(--mute);font-size:12.5px;margin-top:4px}
.sample{display:inline-block;font-size:11px;font-weight:600;color:var(--mute);border:1px dashed var(--line);border-radius:99px;padding:2px 9px;margin-top:8px}
.week{touch-action:pan-y;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:14px}
.wide .week{max-width:560px}
.day{height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--mute);position:relative}
.day b{font-size:10.5px;font-weight:600}.day span{font-size:19px;font-family:var(--display);line-height:1.1}
.day[aria-pressed="true"]{background:var(--card2);color:var(--ink);box-shadow:inset 0 -2.5px 0 var(--mute)}
.day i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--warn)}
.gp{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.pager{overflow:hidden;margin:0 -16px;touch-action:pan-y;position:relative;min-height:max(340px,calc(100vh - 330px))}
.ptrack{display:flex;width:300%;align-items:flex-start;transform:translate3d(-33.3333%,0,0);will-change:transform}
.ptrack.anim{transition:transform .32s cubic-bezier(.22,.8,.25,1)}
.pg{width:33.3333%;flex:none;box-sizing:border-box;padding:0 16px;display:flow-root;min-width:0}
.pager:not(.dragging) .pg:not(.cur){height:0;overflow:hidden}
.pill{height:40px;padding:0 17px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.week.wk-next{animation:wkn .3s ease-out}.week.wk-prev{animation:wkp .3s ease-out}
@keyframes wkn{from{transform:translateX(28px);opacity:.15}to{transform:none;opacity:1}}
@keyframes wkp{from{transform:translateX(-28px);opacity:.15}to{transform:none;opacity:1}}
.day.now:not([aria-pressed="true"]) span{color:var(--ink)}
.gpb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:99px;font-weight:600;letter-spacing:.08em;font-size:11.5px;text-transform:uppercase}
.gpb.late{background:var(--late-bg);color:var(--late-ink)}.gpb.morning{background:var(--morning-bg);color:var(--morning-ink)}
.gpb.aft{background:var(--aft-bg);color:var(--aft-ink)}.gpb.eve{background:var(--eve-bg);color:var(--eve-ink)}.gpb.nod{background:var(--nod-bg);color:var(--nod-ink)}
.gpb svg.ch{transition:transform .2s}.gpb[aria-expanded="false"] svg.ch{transform:rotate(-90deg)}
.rb{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--mute)}
.list{display:grid;gap:7px}
.task{display:flex;align-items:center;gap:11px;padding:7px 4px 7px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:transform .35s ease,opacity .3s ease,max-height .35s ease,padding .35s ease,margin .35s ease,border-width .35s ease;max-height:90px;position:relative}
.task:active{transform:scale(.985)}
.task.leave{transform:translateX(34px);opacity:0;max-height:0;padding-block:0;margin-top:0;margin-bottom:-7px;border-width:0;overflow:hidden}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:#1E2430}
.ic.sky{background:#A9D7EA}.ic.pink{background:#F7D3E8}.ic.lav{background:#D3D6F7}.ic.mint{background:#BDE8D1}.ic.peach{background:#FBD7B8}.ic.sand{background:#EADFB5}
.ic.ev{background:var(--blue);color:#fff}
.tb{flex:1;min-width:0;text-align:left;min-height:38px;display:flex;flex-direction:column;justify-content:center}
.tb b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;line-height:1.25}
.tb small{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:5px}
.task.done .tb b{text-decoration:line-through;color:var(--mute)}
.ck{width:44px;height:44px;display:grid;place-items:center;flex:none}
.ck i{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;color:var(--ok-ink);position:relative;transition:background .2s,border-color .2s}
.ck i svg path{stroke-dasharray:24;stroke-dashoffset:24}
.task.done .ck i{background:var(--ok);border-color:var(--ok)}
.task.done .ck i svg path{stroke-dashoffset:0;transition:stroke-dashoffset .32s ease .08s}
.task.pop .ck i{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.task.pop::after{content:"";position:absolute;inset:0;border-radius:18px;background:var(--ok);opacity:0;animation:wash .65s ease-out;pointer-events:none}
.pt{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;pointer-events:none;animation:burst .65s ease-out forwards}
.ring{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;border:2px solid var(--ok);pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes wash{0%{opacity:.28}100%{opacity:0}}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.task.pop .ck i,.bump,.task.pop::after,.pt,.ring{animation:none}.task{transition:none}}
.nodate{border:1.5px dashed var(--line);border-radius:22px;padding:7px;display:grid;gap:7px}
.nodate .empty{color:var(--mute);padding:8px 10px;font-size:13.5px}
.missed{margin-top:22px;border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--card)}
.missed b{font-family:var(--display);font-weight:500;font-size:16px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;flex:none}
.chip em{font-style:normal;color:var(--mute);font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip[aria-pressed="true"] em{color:inherit;opacity:.65}
.today-wide{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.tl{position:sticky;top:12px;margin-top:18px;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:14px 12px 14px 8px;max-height:640px;overflow:auto}
.tl h3{margin:0 0 8px 8px;font-family:var(--display);font-weight:500;font-size:16px}
.tlg{position:relative}
.tlh{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tlh span{position:absolute;left:4px;top:-8px;font-size:10.5px;color:var(--mute);background:var(--card);padding-right:4px;font-variant-numeric:tabular-nums}
.blk{position:absolute;left:46px;right:4px;border-radius:12px;padding:4px 9px;font-size:12px;overflow:hidden;line-height:1.25}
.blk b{display:block;font-weight:600}.blk small{opacity:.8;font-size:11px}
.blk.ev{background:var(--blue);color:#fff}.blk.free{border:1.5px dashed var(--line);color:var(--mute);background:none}
.blk.sky{background:#A9D7EA;color:#1E2430}.blk.pink{background:#F7D3E8;color:#1E2430}.blk.lav{background:#D3D6F7;color:#1E2430}.blk.mint{background:#BDE8D1;color:#1E2430}.blk.peach{background:#FBD7B8;color:#1E2430}.blk.sand{background:#EADFB5;color:#1E2430}
.search{position:sticky;top:0;z-index:9;background:var(--bg);padding:10px 0 6px}
.search label{display:flex;align-items:center;gap:9px;height:42px;border-radius:99px;background:var(--card);border:1px solid var(--line);padding:0 15px;color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;outline:0}
.pwide{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:24px;align-items:start}
.pdetail{position:sticky;top:12px;margin-top:10px}
.task.sel{border-color:var(--ink)}
.prow{border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;overflow:hidden}
.prow.sel{border-color:var(--ink)}
.tabs4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px;margin:6px 0 10px}
.tabs4 .chip{height:34px;padding:0 4px;border-radius:12px;border:0;background:transparent;justify-content:center;gap:5px;font-size:12.5px}
.tabs4 .chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.qrow{display:flex;align-items:center;gap:6px;padding:7px 8px 7px 7px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:6px}
.qrow.sel{border-color:var(--ink)}
.qm{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:0}
.qm .pn{min-width:0}
.qm .pn b{font-size:14.5px}
.qm .pn small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qm em{font-style:normal;color:var(--mute);font-size:11px;font-weight:500;margin-left:6px}
.qb{height:34px;padding:0 13px;border-radius:99px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;flex:none;margin-left:12px;border:0}
.qb.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.qghost{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-radius:18px;border:1px dashed var(--line);margin-bottom:6px;font-size:13px;color:var(--mute)}
.qghost span{flex:1;min-width:0}
.qstrips{display:flex;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.qs{flex:1;min-width:150px;padding:10px 13px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;text-align:left;color:var(--ink)}
.qs.warn{background:var(--late-bg);color:var(--late-ink);border-color:transparent}
.selrow{display:flex;gap:8px;align-items:center;margin:2px 0 10px}
.psel{height:40px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:14px;padding:0 14px;max-width:100%;min-width:0}
.qlog .chip{height:30px;padding:0 11px;font-size:12px}
.phead{display:flex;align-items:center;gap:11px;width:100%;padding:6px 12px 6px 8px;min-height:52px;text-align:left}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#1E2430;flex:none}
.pn{flex:1;min-width:0}.pn b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{color:var(--mute);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small.na{color:var(--ink);opacity:.82}
.pn small.nn{font-style:italic;padding:3px 0}
.due{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mute);white-space:nowrap}
.due.late{background:var(--late-bg);color:var(--late-ink)}.due.today{background:var(--morning-bg);color:var(--morning-ink)}
.pact{display:flex;gap:7px;padding:0 10px 10px}
.pact button{flex:1;height:40px;border-radius:99px;background:var(--card2);font-weight:600;font-size:13px}
.pact button.main,.btn.main{background:var(--btn);color:var(--btn-ink)}
.wide .pact{display:none}
.rail[hidden]{display:none}
.rail{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:8}
.rail button{width:20px;height:14px;font-size:9.5px;font-weight:700;color:var(--mute);line-height:14px}
.letter{font-family:var(--display);font-size:17px;color:var(--mute);margin:14px 0 6px 4px}
.sent{height:1px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wide .tiles{grid-template-columns:repeat(4,1fr)}
.tile{border-radius:20px;background:var(--card);border:1px solid var(--line);padding:12px 14px;min-width:0}
.tile small{color:var(--mute);font-size:12px}.tile b{display:block;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--mute)}
.tile.warn b{color:var(--warn)}
.card{border-radius:22px;background:var(--card);border:1px solid var(--line);padding:14px;margin-top:10px;min-width:0}
.card h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.card p{margin:3px 0 0;color:var(--mute);font-size:12.5px}
.flag{border-radius:16px;background:var(--late-bg);color:var(--late-ink);padding:10px 13px;font-size:13px;margin-top:10px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start;margin-top:10px}
.tgrid .card{margin-top:0}.tgrid .full{grid-column:1/-1}
svg.chart{width:100%;height:auto;margin-top:8px}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--body)}
.chart .g{stroke:var(--line);stroke-width:1}.chart .a{stroke:var(--chart);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chart .p{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}

function hxKidHeightStatus(z){return z<-3?['high','Severe stunting (below -3 SD)']:z<-2?['watch','Short for age (-3 to -2 SD)']:z>2?['info','Tall for age (above +2 SD)']:['ok','Normal (-2 to +2 SD)']}
/* Builds everything shown for one person: key numbers, flags and what is due. */
function hxAssess(p){
 var t=hxToday(),kid=hxIsKid(p,t),F=[],FL=[],DUE=[];
 var w=hxLast(p.id,'weight'),h=hxLast(p.id,'height'),bs=hxBmiSeries(p.id),bl=bs.length?bs[bs.length-1]:null;
 if(w)F.push({k:'Weight',v:hxFmt(w.v,1)+' kg',d:w.d});
 if(h)F.push({k:'Height',v:hxFmt(h.v,1)+' cm',d:h.d});
 if(bl){
  if(kid){var K=hxKid(p,bl.v,h?h.v:null,bl.d);
   if(K.bz!=null){var st=hxKidBmiStatus(K.bz);F.push({k:'BMI',v:hxFmt(bl.v,1),d:bl.d,st:st[0],note:'z '+hxZs(K.bz)+', '+hxFmt(K.bp,0)+'th percentile. '+st[1]});
    FL.push({st:st[0],txt:'BMI for age is '+hxFmt(bl.v,1)+' (z '+hxZs(K.bz)+', '+hxFmt(K.bp,0)+'th percentile). '+st[1]+'. WHO median at this age is '+hxFmt(K.bmed,1)+'.'});
    if(K.bz>1){var hh=bl.h/100;FL.push({st:'info',txt:'For '+hxShort(p)+'\'s current height the top of the WHO normal band (+1 SD) is about '+hxFmt(K.b1*hh*hh,1)+' kg and the median is about '+hxFmt(K.bmed*hh*hh,1)+' kg. In growing children the usual goal is steady weight while height catches up, so ask the doctor which approach fits.'})}}
   else F.push({k:'BMI',v:hxFmt(bl.v,1),d:bl.d,st:'info',note:'WHO tables start at age 5'});
   if(K.hz!=null){var sh=hxKidHeightStatus(K.hz);FL.push({st:sh[0],txt:'Height '+hxFmt(h.v,1)+' cm is z '+hxZs(K.hz)+' ('+hxFmt(K.hp,0)+'th percentile). '+sh[1]+'. WHO median at this age is '+hxFmt(K.hmed,1)+' cm.'})}}
  else{var sa=hxBmiAdult(bl.v);F.push({k:'BMI',v:hxFmt(bl.v,1),d:bl.d,st:sa[0],note:sa[1]});FL.push({st:sa[0],txt:'BMI '+hxFmt(bl.v,1)+'. '+sa[1]+'.'})}}
 var y=hxAgeY(p.dob,t);
 var bf=hxLast(p.id,'bodyfat');if(bf){if(!kid){var s1=hxFatAdult(bf.v,p.sex);F.push({k:'Body fat',v:hxFmt(bf.v,1)+'%',d:bf.d,st:s1[0],note:s1[1]});FL.push({st:s1[0],txt:'Body fat '+hxFmt(bf.v,1)+'%. '+s1[1]+'.'})}else F.push({k:'Body fat',v:hxFmt(bf.v,1)+'%',d:bf.d,st:'info',note:'Trend only for children. Read it with the doctor.'})}
 var mu=hxLast(p.id,'muscle');if(mu)F.push({k:'Skeletal muscle',v:hxFmt(mu.v,1)+'%',d:mu.d,st:'info',note:'Compare with the level the scale shows (1 to 5)'});
 var vi=hxLast(p.id,'visceral');if(vi&&!kid){var s2=hxVisc(vi.v);F.push({k:'Visceral fat',v:hxFmt(vi.v,1),d:vi.d,st:s2[0],note:s2[1]});FL.push({st:s2[0],txt:'Visceral fat level '+hxFmt(vi.v,1)+'. '+s2[1]+'.'})}
 var rm=hxLast(p.id,'rm');if(rm)F.push({k:'Resting metabolism',v:Math.round(rm.v)+' kcal',d:rm.d,st:'info'});
 var ba=hxLast(p.id,'bodyage');if(ba&&!kid){var df=Math.round(ba.v-y);F.push({k:'Body age',v:Math.round(ba.v)+'',d:ba.d,st:df>3?'watch':df<=0?'ok':'info',note:df===0?'Same as real age':(df>0?df+' years older than real age':(-df)+' years younger than real age')});if(df>3)FL.push({st:'watch',txt:'Body age is '+df+' years above real age.'})}
 var sy=hxLast(p.id,'bpsys'),di=hxLast(p.id,'bpdia');
 if(sy&&di){if(!kid){var s3=hxBp(sy.v,di.v);F.push({k:'Blood pressure',v:Math.round(sy.v)+'/'+Math.round(di.v),d:sy.d,st:s3[0],note:s3[1]});FL.push({st:s3[0],txt:'Blood pressure '+Math.round(sy.v)+'/'+Math.round(di.v)+'. '+s3[1]+'. One reading is not a diagnosis, repeat it on another day.'})}else F.push({k:'Blood pressure',v:Math.round(sy.v)+'/'+Math.round(di.v),d:sy.d,st:'info',note:'Children need age and height charts, ask the doctor'})}
 var tv=hxLast(p.id,'testis');if(tv&&p.sex==='m'){F.push({k:'Testicular volume',v:hxFmt(tv.v,0)+' ml',d:tv.d,st:'info',note:'4 ml or more is the usual start of puberty'});if(tv.v>=4){var ty=hxAgeY(p.dob,tv.d);FL.push(ty<9?{st:'watch',txt:'Testicular volume '+hxFmt(tv.v,0)+' ml before age 9. Puberty signs this early should be reviewed by the doctor.'}:{st:'info',txt:'Testicular volume '+hxFmt(tv.v,0)+' ml is the usual marker of puberty starting. Normal onset for boys is age 9 to 14. Keep watching voice, height speed and body hair.'})}}
 var pu=hxLast(p.id,'pulse');if(pu)F.push({k:'Pulse',v:Math.round(pu.v)+' bpm',d:pu.d,st:'info'});
 var wa=hxLast(p.id,'waist');if(wa){var sw=kid?null:hxLab('waist',wa.v,p.sex);F.push({k:'Waist',v:hxFmt(wa.v,1)+' cm',d:wa.d,st:sw?sw[0]:'info',note:sw?sw[1]:''});if(sw&&sw[0]!=='ok')FL.push({st:sw[0],txt:'Waist '+hxFmt(wa.v,1)+' cm. '+sw[1]+'.'})}
 ['glucose','hba1c','tc','ldl','hdl','tg','vitd'].forEach(function(k){var r=hxLast(p.id,k);if(!r)return;var s=kid?null:hxLab(k,r.v,p.sex);F.push({k:HM[k][0],v:hxFmt(r.v,k==='hba1c'?1:0)+' '+HM[k][1],d:r.d,st:s?s[0]:'info',note:s?s[1]:'Child ranges differ, use the lab printout'});if(s&&s[0]!=='ok')FL.push({st:s[0],txt:HM[k][0]+' '+hxFmt(r.v,k==='hba1c'?1:0)+' '+HM[k][1]+'. '+s[1]+'.'})});
 /* what is due */
 var hl=hxRows(p.id,'height'),lastH=hl.length?hl[hl.length-1].d:null;
 if(kid){if(!lastH)DUE.push('No height on record yet');else if(hxDays(lastH,t)>100)DUE.push('Height check due, last one '+hxDays(lastH,t)+' days ago (every 3 months)')}
 var om=HL.filter(function(r){return r.pid===p.id&&r.src==='Omron'&&r.void!=='1'}).map(function(r){return r.date}).sort(),lo=om.length?om[om.length-1]:null;
 if(!lo)DUE.push('No Omron scan yet');else if(hxDays(lo,t)>21)DUE.push('Omron scan due, last one '+hxDays(lo,t)+' days ago');
 var ck=HL.filter(function(r){return r.pid===p.id&&r.void!=='1'&&(r.src==='Clinic'||r.src==='Lab')}).map(function(r){return r.date}).concat(HV.filter(function(v){return v.pid===p.id}).map(function(v){return v.date})).sort(),lc=ck.length?ck[ck.length-1]:null;
 if(!lc)DUE.push('No checkup on record yet');else if(hxDays(lc,t)>365)DUE.push('Yearly checkup due, last one '+hxDays(lc,t)+' days ago');
 HV.filter(function(v){return v.pid===p.id&&v.fu&&v.fudate&&v.fudone!=='1'&&v.fudate<=t}).forEach(function(v){DUE.push('Follow-up due: '+v.fu+' ('+v.fudate+')')});
 return {kid:kid,F:F,FL:FL,DUE:DUE,age:hxAgeTxt(p.dob,t),worst:FL.reduce(function(a,f){return f.st==='high'?'high':(f.st==='watch'&&a!=='high'?'watch':a)},'ok')}}
/* ---- small charts ---- */
function hxSpark(pts,unit,dec){
 if(!pts.length)return '<p class="meta" style="margin:6px 0 0">Nothing logged yet</p>';
 var W=300,H=70,P=8,vs=pts.map(function(q){return q.v}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);if(mn===mx){mn-=1;mx+=1}
 var t0=+new Date(pts[0].d),t1=+new Date(pts[pts.length-1].d);
 function X(q,i){return pts.length===1?W/2:P+(W-2*P)*(t1===t0?i/(pts.length-1):(new Date(q.d)-t0)/(t1-t0))}
 function Y(v){return H-P-(H-2*P)*(v-mn)/(mx-mn)}
 var line=pts.map(function(q,i){return X(q,i).toFixed(1)+','+Y(q.v).toFixed(1)}).join(' '),l=pts[pts.length-1],f=pts[0];
 return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Trend">'+(pts.length>1?'<polyline points="'+line+'" fill="none" stroke="var(--chart)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>':'')+pts.map(function(q,i){return '<circle cx="'+X(q,i).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="'+(i===pts.length-1?4:2.6)+'" fill="'+(i===pts.length-1?'var(--ink)':'var(--chart)')+'"/>'}).join('')+'</svg><div class="hx-sub"><span>'+esc(f.d)+(pts.length>1?': '+hxFmt(f.v,dec)+'':'')+'</span><span>'+esc(l.d)+': <b>'+hxFmt(l.v,dec)+' '+unit+'</b></span></div>'}
function hxGrowth(p,kind){
 var pts=(kind==='b'?hxBmiSeries(p.id).map(function(q){return {m:hxMonths(p.dob,q.d),v:q.v}}):hxRows(p.id,'height').map(function(q){return {m:hxMonths(p.dob,q.d),v:q.v}})).filter(function(q){return q.m>=60&&q.m<=228});
 var nowM=hxMonths(p.dob,hxToday());if(nowM<60||nowM>228)return '';
 var lo=Math.max(60,Math.floor((pts.length?Math.min(pts[0].m,nowM):nowM)-12)),hi=Math.min(228,Math.ceil((pts.length?Math.max(pts[pts.length-1].m,nowM):nowM)+18));
 if(hi-lo<24){hi=Math.min(228,lo+24);lo=Math.max(60,hi-24)}
 var Z=[-2,-1,0,1,2],cur={},ymin=1e9,ymax=-1e9,m;
 Z.forEach(function(z){cur[z]=[];for(m=lo;m<=hi;m+=2){var v=hxAt(hxLms(kind,p.sex,m),z);cur[z].push([m,v]);if(v<ymin)ymin=v;if(v>ymax)ymax=v}});
 pts.forEach(function(q){if(q.v<ymin)ymin=q.v;if(q.v>ymax)ymax=q.v});
 var W=320,H=190,L=34,R=8,T=8,B=22,pad=(ymax-ymin)*0.05;ymin-=pad;ymax+=pad;
 function X(mm){return L+(W-L-R)*(mm-lo)/(hi-lo)}function Y(v){return H-B-(H-T-B)*(v-ymin)/(ymax-ymin)}
 var s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="WHO growth chart">';
 for(var g=0;g<4;g++){var gv=ymin+(ymax-ymin)*g/3;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(gv).toFixed(1)+'" y2="'+Y(gv).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-4)+'" y="'+(Y(gv)+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--mute)">'+hxFmt(gv,kind==='b'?0:0)+'</text>'}
 for(var ay=Math.ceil(lo/12);ay<=Math.floor(hi/12);ay++){s+='<text x="'+X(ay*12).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--mute)">'+ay+'y</text>'}
 Z.forEach(function(z){var d=cur[z].map(function(q,i){return (i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)}).join('');s+='<path d="'+d+'" fill="none" stroke="'+(z===0?'var(--ink)':Math.abs(z)===2?'var(--warn)':'var(--mute)')+'" stroke-width="'+(z===0?1.6:1.1)+'"'+(Math.abs(z)===1?' stroke-dasharray="4 3"':'')+'/>';var e=cur[z][cur[z].length-1];s+='<text x="'+(X(e[0])-2).toFixed(1)+'" y="'+(Y(e[1])-3).toFixed(1)+'" text-anchor="end" font-size="8" fill="var(--mute)">'+(z>0?'+':'')+z+'</text>'});
 if(pts.length>1)s+='<polyline points="'+pts.map(function(q){return X(q.m).toFixed(1)+','+Y(q.v).toFixed(1)}).join(' ')+'" fill="none" stroke="var(--chart)" stroke-width="2"/>';
 pts.forEach(function(q,i){s+='<circle cx="'+X(q.m).toFixed(1)+'" cy="'+Y(q.v).toFixed(1)+'" r="'+(i===pts.length-1?4.5:3)+'" fill="var(--chart)" stroke="var(--bg)" stroke-width="1.5"/>'});
 return s+'</svg>'}
function hxVelocity(p){
 var a=hxRows(p.id,'height');if(a.length<2)return '';
 var l=a[a.length-1],q=null,i;for(i=a.length-2;i>=0;i--){if(hxDays(a[i].d,l.d)>=60){q=a[i];break}}
 if(!q)return '';var per=(l.v-q.v)/hxDays(q.d,l.d)*365.25,ym=hxMonths(p.dob,l.d)/12;
 var st=(ym>=5&&ym<10&&per<4)?'watch':'info';
 return '<div class="hx-vel">'+hxChip(st,hxFmt(per,1)+' cm per year')+'<span class="meta"> from '+esc(q.d)+' to '+esc(l.d)+(st==='watch'?'. Slower than the usual 5 to 6 cm per year before puberty, mention it at the next visit.':'. Usual growth before puberty is about 5 to 6 cm per year.')+'</span></div>'}
/* ---- pages ---- */
function hxTop(){return '<div class="top"><div class="stats"></div><div class="capsule"><button data-act="menu" aria-label="Menu">'+ic('dots',20)+'</button></div></div><div class="hrow"><h1>Family Health</h1></div>'}
function hxChips(){var s='<div class="chips" style="margin:0 0 14px"><button class="chip" data-hx="p:all" aria-pressed="'+(HSEL==='all')+'">Everyone</button>';HP.forEach(function(p){s+='<button class="chip" data-hx="p:'+esc(p.id)+'" aria-pressed="'+(HSEL===p.id)+'">'+esc(hxShort(p))+'</button>'});return s+'</div>'}
function healthPage(){

 if(!HP.length)return h+'<div class="missed"><b>No family profiles yet</b><p class="meta" style="margin:6px 0 0">Waiting for the healthpeople tab to load from your Sheet. Pull down or reopen HQ in a moment.</p></div>';

function hxOverview(){
 var s='<div class="list" style="gap:12px">';
 HP.forEach(function(p){var a=hxAssess(p),first=a.FL.filter(function(f){return f.st!=='info'})[0];
  s+='<button class="card hx-card" data-hx="p:'+esc(p.id)+'"><div class="hx-h"><b>'+esc(hxShort(p))+'</b><span class="meta">'+esc(a.age)+'</span>'+(a.FL.length?hxChip(a.worst,a.worst==='ok'?'On track':a.worst==='watch'?'Watch':'Talk to doctor'):hxChip('info','No data yet'))+'</div>'
  +'<div class="hx-nums">'+a.F.filter(function(f){return /^(Weight|Height|BMI|Body fat)$/.test(f.k)}).map(function(f){return '<span><small>'+esc(f.k)+'</small><b>'+esc(f.v)+'</b></span>'}).join('')+'</div>'
  +(first?'<p class="meta" style="margin:8px 0 0">'+esc(first.txt)+'</p>':'')
  +(a.DUE.length?'<p class="hx-due">'+ic('clock',14)+esc(a.DUE[0])+(a.DUE.length>1?' (+'+(a.DUE.length-1)+' more)':'')+'</p>':'')+'</button>'});
 return s+'</div><p class="meta" style="margin:14px 2px 0">A screening aid. It does not replace the doctor. Children are scored against WHO growth references, adults against standard screening ranges.</p>'}
function hxProfile(p){
 var a=hxAssess(p),t=hxToday(),s='<div class="card"><div class="hx-h"><b style="font-size:18px">'+esc(p.name)+'</b></div><p class="meta" style="margin:4px 0 0">'+esc(a.age)+', born '+esc(p.dob)+(p.sex==='f'?', female':', male')+'</p>';
 s+='<div class="chips" style="margin-top:12px"><button class="chip" data-hx="om">+ Omron scan</button><button class="chip" data-hx="ck">+ Checkup or labs</button><button class="chip" data-hx="visit">+ Doctor visit</button><button class="chip" data-hx="sum">Summary for a doctor</button></div></div>';
 if(a.DUE.length)s+='<div class="card hx-dues"><h2>Due</h2>'+a.DUE.map(function(d){return '<p class="hx-due">'+ic('clock',14)+esc(d)+'</p>'}).join('')+'</div>';
 if(a.FL.length){s+='<div class="card"><h2>Assessment</h2>'+a.FL.map(function(f){return '<div class="hx-flag">'+hxChip(f.st==='info'?'info':f.st,f.st==='ok'?'OK':f.st==='watch'?'Watch':f.st==='high'?'Flag':'Note')+'<p>'+esc(f.txt)+'</p></div>'}).join('')+'<p class="meta" style="margin:10px 0 0">Screening aid only. Decisions belong with the doctor.</p></div>'}
 else s+='<div class="card"><h2>Assessment</h2><p class="meta" style="margin:6px 0 0">Add height and weight to get the first assessment.</p></div>';
 if(a.F.length){s+='<div class="hx-grid">'+a.F.map(function(f){return '<div class="card hx-tile"><small>'+esc(f.k)+'</small><b>'+esc(f.v)+'</b>'+(f.st&&f.st!=='info'?hxChip(f.st,f.st==='ok'?'OK':f.st==='watch'?'Watch':'Flag'):'')+(f.note?'<span class="meta">'+esc(f.note)+'</span>':'')+'<span class="meta">'+esc(f.d)+'</span></div>'}).join('')+'</div>'}
 if(a.kid)s+=hxPuberty(p);
 if(a.kid){var gb=hxGrowth(p,'b'),gh=hxGrowth(p,'h');
  if(gb)s+='<div class="card"><h2>BMI for age (WHO)</h2>'+gb+'<p class="meta" style="margin:6px 0 0">Lines show -2, -1, median, +1 and +2 SD. Your child is the blue line.</p></div>';
  if(gh)s+='<div class="card"><h2>Height for age (WHO)</h2>'+gh+hxVelocity(p)+'</div>'}
 var T=[['weight','Weight','kg',1],['height','Height','cm',1],['bodyfat','Body fat','%',1],['muscle','Skeletal muscle','%',1],['visceral','Visceral fat','level',1],['bodyage','Body age','years',0],['rm','Resting metabolism','kcal',0]];
 var bmis=hxBmiSeries(p.id).map(function(q){return {d:q.d,v:q.v}});
 var tr='';if(bmis.length)tr+='<div class="hx-tr"><b>BMI</b>'+hxSpark(bmis,'',1)+'</div>';
 T.forEach(function(x){var r=hxRows(p.id,x[0]);if(r.length)tr+='<div class="hx-tr"><b>'+x[1]+'</b>'+hxSpark(r,x[2],x[3])+'</div>'});
 if(tr)s+='<div class="card"><h2>Trends</h2>'+tr+'</div>';
 var vs=HV.filter(function(v){return v.pid===p.id}).sort(function(x,y){return x.date<y.date?1:-1});
 s+='<div class="card"><h2>Doctor visits</h2>'+(vs.length?vs.map(function(v){return '<div class="hx-visit"><b>'+esc(v.date)+'</b> '+esc(v.doctor||'')+(v.spec?' <span class="meta">'+esc(v.spec)+'</span>':'')+(v.place?'<div class="meta">'+esc(v.place)+'</div>':'')+(v.reason?'<p><small>Reason</small> '+esc(v.reason)+'</p>':'')+(v.findings?'<p><small>Findings</small> '+esc(v.findings)+'</p>':'')+(v.fu?'<p><small>Follow-up</small> '+esc(v.fu)+(v.fudate?' ('+esc(v.fudate)+')':'')+(v.fudone==='1'?' '+hxChip('ok','Done'):(v.fudate&&v.fudate<=t?' <button class="chip" data-hx="fudone:'+esc(v.id)+'">Mark done</button>':''))+'</p>':'')+'</div>'}).join(''):'<p class="meta" style="margin:6px 0 0">No visits yet</p>')+'</div>';
 var lg=HL.filter(function(r){return r.pid===p.id}).sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:0}),lim=HMORE?lg.length:12;
 s+='<div class="card"><h2>History</h2>'+(lg.length?lg.slice(0,lim).map(function(r){var m=HM[r.metric]||[r.metric,r.unit||''];return '<div class="hx-log'+(r.void==='1'?' void':'')+'"><span>'+esc(r.date)+'</span><span>'+esc(m[0])+'</span><b>'+esc(r.value)+' '+esc(r.unit||m[1])+'</b><span class="meta">'+esc(r.src||'')+'</span>'+(r.void==='1'?'<span class="meta">marked wrong</span>':'<button class="chip" data-hx="void:'+esc(r.id)+'" aria-label="Mark wrong">Wrong?</button>')+'</div>'}).join('')+(lg.length>12?'<button class="chip" data-hx="more" style="margin-top:8px">'+(HMORE?'Show less':'Show all '+lg.length)+'</button>':'')+'<p class="meta" style="margin:10px 0 0">Nothing is ever deleted. A wrong entry is only marked and left out of the numbers.</p>':'<p class="meta" style="margin:6px 0 0">No entries yet</p>')+'</div>';
