<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>HQ</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HQ">
<meta name="theme-color" content="#09090A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: Tiimo-style day list. Phone = one column with floating tab capsule. iPad and Mac = sidebar, multi-pane (timeline, master-detail, board). */
:root{
  --bg:#09090A; --card:#131315; --card2:#1C1C1F; --ink:#F5F4F1; --mute:#8D8D96; --line:#27272B;
  --late-bg:#B4532B; --late-ink:#FFF3EC; --morning-bg:#8D8847; --morning-ink:#FFFBE0;
  --aft-bg:#5F3B50; --aft-ink:#FFE9F3; --eve-bg:#4B3F7D; --eve-ink:#EEEAFF; --nod-bg:#222226; --nod-ink:#E8E8EC;
  --blue:#1558B0; --ok:#7ED3A6; --ok-ink:#06251A; --warn:#F2A15F; --crit:#F0735A;
  --chart:#7FB3FF; --btn:#F5F4F1; --btn-ink:#09090A; --glass:rgba(32,32,36,.82); --shadow:rgba(0,0,0,.5);
  --display:'Fraunces',Georgia,serif; --body:'DM Sans',system-ui,sans-serif; color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F6F5F2; --card:#FFFFFF; --card2:#EFEEEA; --ink:#17171A; --mute:#6C6C75; --line:#E4E3DE;
  --late-bg:#F6CDBA; --late-ink:#6B2A0E; --morning-bg:#EBE3A4; --morning-ink:#4A4410; --aft-bg:#EFCFDC; --aft-ink:#5B2340;
  --eve-bg:#DAD3F5; --eve-ink:#312466; --nod-bg:#E6E5E1; --nod-ink:#2D2D33; --blue:#2F6FD0; --ok:#4FB985; --ok-ink:#FFFFFF;
  --warn:#C9722A; --crit:#C94B34; --chart:#2F6FD0; --btn:#17171A; --btn-ink:#F6F5F2; --glass:rgba(255,255,255,.86); --shadow:rgba(30,30,40,.25); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F6F5F2; --card:#FFFFFF; --card2:#EFEEEA; --ink:#17171A; --mute:#6C6C75; --line:#E4E3DE;
  --late-bg:#F6CDBA; --late-ink:#6B2A0E; --morning-bg:#EBE3A4; --morning-ink:#4A4410; --aft-bg:#EFCFDC; --aft-ink:#5B2340;
  --eve-bg:#DAD3F5; --eve-ink:#312466; --nod-bg:#E6E5E1; --nod-ink:#2D2D33; --blue:#2F6FD0; --ok:#4FB985; --ok-ink:#FFFFFF;
  --warn:#C9722A; --crit:#C94B34; --chart:#2F6FD0; --btn:#17171A; --btn-ink:#F6F5F2; --glass:rgba(255,255,255,.86); --shadow:rgba(30,30,40,.25); color-scheme:light;}
:root[data-theme="dark"]{
  --bg:#09090A; --card:#131315; --card2:#1C1C1F; --ink:#F5F4F1; --mute:#8D8D96; --line:#27272B;
  --late-bg:#B4532B; --late-ink:#FFF3EC; --morning-bg:#8D8847; --morning-ink:#FFFBE0; --aft-bg:#5F3B50; --aft-ink:#FFE9F3;
  --eve-bg:#4B3F7D; --eve-ink:#EEEAFF; --nod-bg:#222226; --nod-ink:#E8E8EC; --blue:#1558B0; --ok:#7ED3A6; --ok-ink:#06251A;
  --warn:#F2A15F; --crit:#F0735A; --chart:#7FB3FF; --btn:#F5F4F1; --btn-ink:#09090A; --glass:rgba(32,32,36,.82); --shadow:rgba(0,0,0,.5); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden;
  padding-inline:max(0px,env(safe-area-inset-left,0px)) max(0px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{display:block;flex:none}
#chrome{flex:none;padding-top:max(6px,env(safe-area-inset-top,0px))!important;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--bg)}
#chrome .seg2{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px}
#chrome .seg2 button{height:30px;padding:0 11px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mute)}
#chrome .seg2 button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
#chrome small{font-size:11px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
#stage{padding-top:max(6px,env(safe-area-inset-top,0px));flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
#fwrap{position:relative;width:100%;height:100%}
#frame{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:var(--bg);transform-origin:top left}
#frame.dev{border:1px solid var(--line);border-radius:30px;box-shadow:0 20px 60px var(--shadow)}
#shell{display:grid;grid-template-columns:minmax(0,1fr);height:100%}
.wide #shell{grid-template-columns:224px minmax(0,1fr)}
#scroller{overflow-y:auto;overflow-x:hidden;height:100%;position:relative;overscroll-behavior:contain}
.app{max-width:520px;margin:0 auto;padding:0 16px 130px}
.wide .app{max-width:none;padding:0 28px 60px}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:12px}
.stats{display:flex;gap:14px;align-items:center;font-weight:600;font-size:14px}
.stats span{display:flex;gap:5px;align-items:center}
.stats .f{color:#C9A0FF}.stats .s{color:#9FD3E8}
.bump{animation:bump .45s cubic-bezier(.2,1.6,.4,1)}
.capsule{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:99px;height:40px}
.capsule button{width:46px;height:40px;display:grid;place-items:center}
h1{font-family:var(--display);font-weight:500;font-size:31px;line-height:1.05;margin:0;letter-spacing:-.01em}
.wide h1{font-size:34px}
.hrow{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:16px}
.hrow small{color:var(--mute);font-size:11.5px;letter-spacing:.1em;font-weight:600;text-transform:uppercase;padding-bottom:6px;white-space:nowrap}
.sub{color:var(--mute);font-size:12.5px;margin-top:4px}
.sample{display:inline-block;font-size:11px;font-weight:600;color:var(--mute);border:1px dashed var(--line);border-radius:99px;padding:2px 9px;margin-top:8px}
.week{touch-action:pan-y;display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:14px}
.wide .week{max-width:560px}
.day{height:54px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--mute);position:relative}
.day b{font-size:10.5px;font-weight:600}.day span{font-size:19px;font-family:var(--display);line-height:1.1}
.day[aria-pressed="true"]{background:var(--card2);color:var(--ink);box-shadow:inset 0 -2.5px 0 var(--mute)}
.day i{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--warn)}
.gp{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
.pager{overflow:hidden;margin:0 -16px;touch-action:pan-y;position:relative;min-height:max(340px,calc(100vh - 330px))}
.ptrack{display:flex;width:300%;align-items:flex-start;transform:translate3d(-33.3333%,0,0);will-change:transform}
.ptrack.anim{transition:transform .32s cubic-bezier(.22,.8,.25,1)}
.pg{width:33.3333%;flex:none;box-sizing:border-box;padding:0 16px;display:flow-root;min-width:0}
.pager:not(.dragging) .pg:not(.cur){height:0;overflow:hidden}
.pill{height:40px;padding:0 17px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;display:inline-flex;align-items:center}
.week.wk-next{animation:wkn .3s ease-out}.week.wk-prev{animation:wkp .3s ease-out}
@keyframes wkn{from{transform:translateX(28px);opacity:.15}to{transform:none;opacity:1}}
@keyframes wkp{from{transform:translateX(-28px);opacity:.15}to{transform:none;opacity:1}}
.day.now:not([aria-pressed="true"]) span{color:var(--ink)}
.gpb{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 12px;border-radius:99px;font-weight:600;letter-spacing:.08em;font-size:11.5px;text-transform:uppercase}
.gpb.late{background:var(--late-bg);color:var(--late-ink)}.gpb.morning{background:var(--morning-bg);color:var(--morning-ink)}
.gpb.aft{background:var(--aft-bg);color:var(--aft-ink)}.gpb.eve{background:var(--eve-bg);color:var(--eve-ink)}.gpb.nod{background:var(--nod-bg);color:var(--nod-ink)}
.gpb svg.ch{transition:transform .2s}.gpb[aria-expanded="false"] svg.ch{transform:rotate(-90deg)}
.rb{width:36px;height:36px;border-radius:50%;background:var(--card2);display:grid;place-items:center;color:var(--mute)}
.list{display:grid;gap:7px}
.task{display:flex;align-items:center;gap:11px;padding:7px 4px 7px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:transform .35s ease,opacity .35s ease,max-height .35s ease;max-height:90px;position:relative}
.task:active{transform:scale(.985)}
.task.leave{transform:translateX(34px);opacity:0;max-height:0;padding-block:0;margin-block:-4px;border-width:0;overflow:hidden}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;color:#1E2430}
.ic.sky{background:#A9D7EA}.ic.pink{background:#F7D3E8}.ic.lav{background:#D3D6F7}.ic.mint{background:#BDE8D1}.ic.peach{background:#FBD7B8}.ic.sand{background:#EADFB5}
.ic.ev{background:var(--blue);color:#fff}
.tb{flex:1;min-width:0;text-align:left;min-height:38px;display:flex;flex-direction:column;justify-content:center}
.tb b{font-weight:600;font-size:14.5px;overflow-wrap:anywhere;line-height:1.25}
.tb small{color:var(--mute);font-size:12px;display:flex;align-items:center;gap:5px}
.task.done .tb b{text-decoration:line-through;color:var(--mute)}
.ck{width:44px;height:44px;display:grid;place-items:center;flex:none}
.ck i{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;color:var(--ok-ink);position:relative;transition:background .2s,border-color .2s}
.ck i svg path{stroke-dasharray:24;stroke-dashoffset:24}
.task.done .ck i{background:var(--ok);border-color:var(--ok)}
.task.done .ck i svg path{stroke-dashoffset:0;transition:stroke-dashoffset .32s ease .08s}
.task.pop .ck i{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.task.pop::after{content:"";position:absolute;inset:0;border-radius:18px;background:var(--ok);opacity:0;animation:wash .65s ease-out;pointer-events:none}
.pt{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;pointer-events:none;animation:burst .65s ease-out forwards}
.ring{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px;border-radius:50%;border:2px solid var(--ok);pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}
@keyframes wash{0%{opacity:.28}100%{opacity:0}}
@keyframes burst{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.task.pop .ck i,.bump,.task.pop::after,.pt,.ring{animation:none}.task{transition:none}}
.nodate{border:1.5px dashed var(--line);border-radius:22px;padding:7px;display:grid;gap:7px}
.nodate .empty{color:var(--mute);padding:8px 10px;font-size:13.5px}
.missed{margin-top:22px;border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--card)}
.missed b{font-family:var(--display);font-weight:500;font-size:16px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:36px;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;flex:none}
.chip em{font-style:normal;color:var(--mute);font-weight:500}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.chip[aria-pressed="true"] em{color:inherit;opacity:.65}
.today-wide{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.tl{position:sticky;top:12px;margin-top:18px;border:1px solid var(--line);border-radius:22px;background:var(--card);padding:14px 12px 14px 8px;max-height:640px;overflow:auto}
.tl h3{margin:0 0 8px 8px;font-family:var(--display);font-weight:500;font-size:16px}
.tlg{position:relative}
.tlh{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.tlh span{position:absolute;left:4px;top:-8px;font-size:10.5px;color:var(--mute);background:var(--card);padding-right:4px;font-variant-numeric:tabular-nums}
.blk{position:absolute;left:46px;right:4px;border-radius:12px;padding:4px 9px;font-size:12px;overflow:hidden;line-height:1.25}
.blk b{display:block;font-weight:600}.blk small{opacity:.8;font-size:11px}
.blk.ev{background:var(--blue);color:#fff}.blk.free{border:1.5px dashed var(--line);color:var(--mute);background:none}
.blk.sky{background:#A9D7EA;color:#1E2430}.blk.pink{background:#F7D3E8;color:#1E2430}.blk.lav{background:#D3D6F7;color:#1E2430}.blk.mint{background:#BDE8D1;color:#1E2430}.blk.peach{background:#FBD7B8;color:#1E2430}.blk.sand{background:#EADFB5;color:#1E2430}
.search{position:sticky;top:0;z-index:9;background:var(--bg);padding:10px 0 6px}
.search label{display:flex;align-items:center;gap:9px;height:42px;border-radius:99px;background:var(--card);border:1px solid var(--line);padding:0 15px;color:var(--mute)}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:15px;outline:0}
.pwide{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:24px;align-items:start}
.pdetail{position:sticky;top:12px;margin-top:10px}
.prow{border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:6px;overflow:hidden}
.prow.sel{border-color:var(--ink)}
.phead{display:flex;align-items:center;gap:11px;width:100%;padding:6px 12px 6px 8px;min-height:52px;text-align:left}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:15px;color:#1E2430;flex:none}
.pn{flex:1;min-width:0}.pn b{display:block;font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{color:var(--mute);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.due{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mute);white-space:nowrap}
.due.late{background:var(--late-bg);color:var(--late-ink)}.due.today{background:var(--morning-bg);color:var(--morning-ink)}
.pact{display:flex;gap:7px;padding:0 10px 10px}
.pact button{flex:1;height:40px;border-radius:99px;background:var(--card2);font-weight:600;font-size:13px}
.pact button.main,.btn.main{background:var(--btn);color:var(--btn-ink)}
.wide .pact{display:none}
.rail{position:absolute;right:2px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;z-index:8}
.rail button{width:20px;height:14px;font-size:9.5px;font-weight:700;color:var(--mute);line-height:14px}
.letter{font-family:var(--display);font-size:17px;color:var(--mute);margin:14px 0 6px 4px}
.sent{height:1px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wide .tiles{grid-template-columns:repeat(4,1fr)}
.tile{border-radius:20px;background:var(--card);border:1px solid var(--line);padding:12px 14px;min-width:0}
.tile small{color:var(--mute);font-size:12px}.tile b{display:block;font-family:var(--display);font-weight:500;font-size:23px;line-height:1.2;margin-top:2px;font-variant-numeric:tabular-nums}
.tile span{font-size:11.5px;color:var(--mute)}
.tile.warn b{color:var(--warn)}
.card{border-radius:22px;background:var(--card);border:1px solid var(--line);padding:14px;margin-top:10px;min-width:0}
.card h2{font-family:var(--display);font-weight:500;font-size:17px;margin:0}
.card p{margin:3px 0 0;color:var(--mute);font-size:12.5px}
.flag{border-radius:16px;background:var(--late-bg);color:var(--late-ink);padding:10px 13px;font-size:13px;margin-top:10px}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-items:start;margin-top:10px}
.tgrid .card{margin-top:0}.tgrid .full{grid-column:1/-1}
svg.chart{width:100%;height:auto;margin-top:8px}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--body)}
.chart .g{stroke:var(--line);stroke-width:1}.chart .a{stroke:var(--chart);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.chart .p{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 5;fill:none}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.lg i{display:inline-block;width:16px;border-top:3px solid var(--chart);vertical-align:middle;margin-right:6px}.lg i.d{border-top:2px dashed var(--mute)}.chart .m{stroke:var(--warn);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.lg i.m{border-top-color:var(--warn)}
.lrow{padding:10px 0;border-top:1px solid var(--line)}.lrow.first{border-top:0}
.lt{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lt b{font-weight:600;font-size:14px;min-width:0;overflow-wrap:anywhere}
.cs{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.cs.reached{background:var(--ok);color:var(--ok-ink)}.cs.track{background:var(--eve-bg);color:var(--eve-ink)}
.cs.behind{background:var(--morning-bg);color:var(--morning-ink)}.cs.urgent{background:var(--late-bg);color:var(--late-ink)}.cs.pan{background:var(--card2);color:var(--mute)}
.trk{position:relative;height:8px;border-radius:4px;background:var(--card2);margin:9px 0 5px}
.trk>b{display:block;height:100%;border-radius:4px;background:var(--chart)}
.trk.reached>b{background:var(--ok)}.trk.behind>b{background:var(--morning-bg)}.trk.urgent>b{background:var(--crit)}
.trk>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:1px}
.meta{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.nest{margin-left:10px;padding-left:10px;border-left:2px solid var(--line)}
.mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.mt span{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--card2)}
.mt span.bad{background:var(--late-bg);color:var(--late-ink)}
.names{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.names span{font-size:12.5px;padding:4px 10px;border-radius:99px;border:1px dashed var(--mute);color:var(--mute)}
.names span.paid{border:1px solid var(--ok);color:var(--ok);font-weight:600}
pre{margin:10px 0 0;font:12px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink)}
.btn{height:44px;border-radius:99px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:0 22px;width:100%;margin-top:10px;font-size:14px}
.btn.alt{background:var(--card2);color:var(--ink)}
.btn.sm{width:auto;height:38px;font-size:13px;padding:0 16px;margin-top:0}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.wide .tiles2{grid-template-columns:repeat(3,1fr)}
.tile2{border-radius:22px;background:var(--card);border:1px solid var(--line);padding:14px;text-align:left;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}

 n.trips.sort(function(x,y){return x.start<y.start?-1:1});TR=n;TK=a[1].rows.map(function(r){return r.id});
 try{localStorage.setItem('hq-trips',JSON.stringify(TR));localStorage.setItem('hq-tticks',JSON.stringify(TK))}catch(e){}

function tripSub(){if(!CFG.url||!TR.trips.length)return 'No trips yet';var t=upTrips()[0];return t?t.name+', '+fmtShort(t.start)+' to '+fmtShort(t.end):'No upcoming trips'}
function tzDate(d){return new Date(d.length===10?d+'T00:00:00+07:00':d)}
function upTrips(){var now=Date.now();return TR.trips.filter(function(t){return tzDate(t.end).getTime()+864e5>now})}
function fmtShort(d){var x=new Date(d.slice(0,10)+'T12:00:00Z');return WD[x.getUTCDay()].slice(0,3)+' '+x.getUTCDate()+' '+MON[x.getUTCMonth()]}
function dUntil(d){return Math.ceil((tzDate(d)-Date.now())/864e5)}
function relD(n){return n<0?'passed':n===0?'today':n===1?'tomorrow':'in '+n+' days'}
function lhm(iso){return iso.slice(11,16)}
function offOf(iso){var m=iso.match(/([+-])(\d\d):(\d\d)$/);return m?(m[1]==='-'?-1:1)*(+m[2]+ +m[3]/60):0}
function homeHM(iso){var d=new Date(new Date(iso).getTime()+7*36e5);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}
function allFl(){var o=[];TR.trips.forEach(function(t){(t.days||[]).forEach(function(d){(d.items||[]).forEach(function(i){if(i.type==='flight')o.push({t:t,f:i})})})});return o.sort(function(a,b){return new Date(a.f.dep)-new Date(b.f.dep)})}
function tRefs(r){return (r||[]).map(function(x){return '<span class="tp-ref"><small>'+esc(x[0])+'</small><code>'+esc(x[1])+'</code>'+(x[2]?'<button class="chip sm" data-tcopy="'+esc(x[1])+'">Copy</button>':'')+'</span>'}).join('')}
function tFacts(f){return f&&f.length?'<dl class="tp-facts">'+f.map(function(x){return '<div><dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd></div>'}).join('')+'</dl>':''}
function tStop(s,iso,end){var home=offOf(iso)!==7?esc(s.tz)+' · '+homeHM(iso)+' Jakarta':esc(s.tz);return '<div class="tp-stop'+(end?' end':'')+'"><b>'+esc(s.code)+'</b><small>'+esc(s.city)+'</small><span>'+lhm(iso)+'</span><small>'+home+'</small></div>'}
function tFlight(f){var past=new Date(f.arr)<new Date(),h='<div class="card tp"><div class="tp-top"><small>'+esc(f.carrier)+' · '+esc(f.fno)+'</small><span class="tp-pill '+(past?'':f.status==='waitlisted'?'warn':'ok')+'">'+(past?'Flown':f.status==='waitlisted'?'Waitlist':'Confirmed')+'</span></div>';
 h+='<div class="tp-route">'+tStop(f.from,f.dep)+'<div class="tp-leg">'+ic('right',18)+'<small>'+esc(f.dur||'')+'</small></div>'+tStop(f.to,f.arr,1)+'</div>'+tFacts(f.facts);
 if(f.live&&!past)h+='<div class="tp-note '+(/delay|changed|cancel/.test(f.live.state)?'warn':'')+'"><b>'+esc(f.live.state)+'</b> · '+esc(f.live.text)+'</div>';

 return h+'<div class="tp-foot">'+tRefs(f.refs)+(f.paid?'<small>'+esc(f.paid)+'</small>':'')+'</div></div>'}
function tHotel(x){var h='<div class="card tp"><div class="tp-top"><small>'+esc(x.kind||'Stay')+'</small></div><h2>'+esc(x.name)+'</h2><p>'+esc(x.addr||'')+'</p><div class="tp-stay"><div><small>Check in</small><b>'+esc(x.inDate)+'</b><small>'+esc(x.inRule||'')+'</small></div><div><small>Check out</small><b>'+esc(x.outDate)+'</b><small>'+esc(x.outRule||'')+'</small></div></div>'+tFacts(x.facts);
 if(x.note)h+='<div class="tp-note">'+esc(x.note)+'</div>';if(x.tip)h+='<div class="tp-note">'+esc(x.tip)+'</div>';

function tItem(i){if(i.type==='flight')return tFlight(i);if(i.type==='hotel')return tHotel(i);

function tripHead(t){var n=dUntil(t.start),nt=Math.round((tzDate(t.end)-tzDate(t.start))/864e5),fl=0,left=0;(t.days||[]).forEach(function(d){(d.items||[]).forEach(function(i){if(i.type==='flight')fl++})});(t.prep||[]).forEach(function(p){if(TK.indexOf(t.id+':'+p.id)<0)left++});

 (t.days||[]).forEach(function(d){var dt=new Date(d.date+'T12:00:00Z');h+='<div class="tp-day"><div class="tp-date"><small>'+WD[dt.getUTCDay()].slice(0,3)+'</small><b>'+dt.getUTCDate()+'</b><small>'+MON[dt.getUTCMonth()]+'</small></div><div style="min-width:0">'+(d.items||[]).map(tItem).join('')+'</div></div>'});
