<style>

  --blue:#2F6FD0; --ok:#4FB985; --ok-ink:#FFFFFF; --warn:#C9722A; --crit:#C94B34;
  --chart:#2F6FD0; --btn:#17171A; --btn-ink:#F6F5F2; --glass:rgba(255,255,255,.86); color-scheme:light;}}
:root[data-theme="light"]{
  --bg:#F6F5F2; --card:#FFFFFF; --card2:#EFEEEA; --ink:#17171A; --mute:#6C6C75; --line:#E4E3DE;
  --late-bg:#F6CDBA; --late-ink:#6B2A0E; --morning-bg:#EBE3A4; --morning-ink:#4A4410;
  --aft-bg:#EFCFDC; --aft-ink:#5B2340; --eve-bg:#DAD3F5; --eve-ink:#312466; --nod-bg:#E6E5E1; --nod-ink:#2D2D33;

*{box-sizing:border-box}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}

svg{display:block;flex:none}
.top{display:flex;justify-content:space-between;align-items:center;padding-top:14px}

.gp{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.gpb{display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 18px 0 16px;border-radius:99px;font-weight:600;letter-spacing:.09em;font-size:13.5px;text-transform:uppercase}

.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}

.meta{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.nest{margin-left:12px;padding-left:12px;border-left:2px solid var(--line)}
.mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mt span{font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--card2)}
.mt span.bad{background:var(--late-bg);color:var(--late-ink)}
.names{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.names span{font-size:13px;padding:5px 11px;border-radius:99px;border:1px dashed var(--mute);color:var(--mute)}
.names span.paid{border:1px solid var(--ok);color:var(--ok);font-weight:600}
pre{margin:12px 0 0;font:12.5px/1.55 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--ink)}
.btn{height:50px;border-radius:99px;background:var(--btn);color:var(--btn-ink);font-weight:700;padding:0 24px;width:100%;margin-top:12px}
.btn.alt{background:var(--card2);color:var(--ink)}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.tile2{border-radius:26px;background:var(--card);border:1px solid var(--line);padding:16px;text-align:left;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.tile2 b{font-weight:600;font-size:16px;display:block}.tile2 small{color:var(--mute);font-size:13.5px}
.nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));z-index:12;pointer-events:none}
.nav .in{max-width:480px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.pillnav{pointer-events:auto;flex:1;display:flex;align-items:center;justify-content:space-between;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:99px;padding:5px}

.pillnav button[aria-current="page"]{background:var(--bg);color:var(--ink)}
.pillnav .bd{position:absolute;top:8px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.more{pointer-events:auto;width:70px;height:70px;border-radius:50%;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);display:grid;place-items:center;flex:none}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border-top:1px solid var(--line);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:88vh;overflow:auto}
.sheet h3{font-family:var(--display);font-weight:500;font-size:24px;margin:0}
.sheet input{height:54px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:0 20px;width:100%}
.bubble{background:var(--eve-bg);color:var(--eve-ink);border-radius:22px 22px 6px 22px;padding:14px 16px;font-size:15px}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btn-ink);padding:12px 20px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:90%;text-align:center}
.note{color:var(--mute);font-size:13px;margin-top:14px}

</style>

 function sync(){s.querySelectorAll('[data-w]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.w===when)});s.querySelectorAll('[data-p]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.p===pt)});s.querySelectorAll('[data-d]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.d===du)})}
 sync();
 s.addEventListener('click',function(e){var b=e.target.closest('[data-w],[data-p],[data-d]');if(!b)return;if(b.dataset.w)when=b.dataset.w;if(b.dataset.p)pt=b.dataset.p;if(b.dataset.d)du=b.dataset.d;sync()});
 s.querySelector('#sv').onclick=function(){var v=s.querySelector('#nt').value.trim();if(!v){toast('Tulis dulu isinya');return}
  tasks.push({id:Date.now(),t:v,day:when==='nod'?null:when==='tom'?32:31,part:pt,dur:du,ic:'spark',c:'sand',done:false});s.remove();tab='today';sel=31;render();toast(when==='nod'?'Masuk ke No date':'Masuk ke Today')}}

 if(d.open){var tk=tasks.filter(function(x){return x.id==d.open})[0];var go=tk.go==='team';sheet('<h3>'+esc(tk.t)+'</h3><p class="meta" style="margin:0">'+(tk.ev?tk.ev+' · 2 jam di kalender AJ Jonathan':(tk.dur||''))+'</p>'+(go?'<button class="btn" data-close="1" data-gotab="team" style="margin-top:0">Buka Team</button>':'')+'<button class="btn alt" data-close="1" style="margin-top:0">Pindah tanggal</button><button class="btn alt" data-close="1" style="margin-top:0">Tanya Claude</button>');return}
 if(d.pv){pview=d.pv;pq='';render();return}
 if(d.ptoggle){var row=el.closest('.prow'),pa=row.querySelector('.pact'),was=!pa.hidden;

 if(d.log){toast('Kontak dicatat');return}
 if(d.next){var pp=people[d.next];sheet('<h3>Follow-up '+esc(pp.n)+'</h3><div class="chips" style="flex-wrap:wrap"><button class="chip" data-close="1">Tomorrow</button><button class="chip" data-close="1">3 hari</button><button class="chip" data-close="1">Next week</button><button class="chip" data-close="1">Pilih tanggal</button></div><button class="btn" data-close="1" style="margin-top:0">Simpan</button>');return}
 if(d.jump){var idx=PITEMS.findIndex(function(x){return x.k==='l'&&x.l===d.jump});while(PSHOWN<=idx&&PSHOWN<PITEMS.length)appendChunk();var t2=document.getElementById('L'+d.jump);if(t2)t2.scrollIntoView({block:'start'});return}
 if(d.tt){teamTab=d.tt;render();return}
 if(d.copy){copy(reportText(),'Disalin. Buka WhatsApp dan tempel.');return}
 if(d.wa){toast('Membuka WhatsApp ke '+d.wa);return}
 if(d.act==='m1'){document.querySelector('.gpb.late')&&document.querySelector('.gpb.late').scrollIntoView({behavior:'smooth',block:'center'});return}
 if(d.act==='m2'){var n=document.querySelector('.nodate');n&&n.scrollIntoView({behavior:'smooth',block:'center'});return}
 if(d.act==='m3'){toast('Besok ada '+tasks.filter(function(x){return x.day===32}).length+' hal');return}
 if(d.act==='editor'){toast('Membuka WhatsApp ke editor');return}

 if(d.act==='menu'||d.act==='item'){toast('Di app asli: layar ini ada');return}
